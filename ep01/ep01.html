<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f5">
<title>라디오</title>

<style>
/* 기본 설정 */
* {
    box-sizing: border-box;
}

html {
    width: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    width: 100%;
    max-width: 690px;
    margin: 0 auto;
    padding: 30px 20px;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #f5f5f5;
    color: #222;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

h1 {
    margin: 0 0 20px;
    font-size: 24px;
    line-height: 1.4;
}

h2 {
    margin: 28px 0 12px;
    font-size: 20px;
}

#status {
    display: none !important;
}

/* 앨범 이미지 */
#audio-artwork-wrapper {
    width: 100%;
    aspect-ratio: 2 / 1;
    margin: 15px 0 0;
    overflow: hidden;
    line-height: 0;
    border-radius: 8px;
    background: #e5e5e5;
}

#audio-artwork {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

/* 오디오 플레이어 */
#audio {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 15px 0;
}

[hidden] {
    display: none !important;
}

/* 재생 버튼 */
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 18px 0;
}

button {
    min-height: 44px;
    padding: 10px 16px;
    border: 0;
    border-radius: 6px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #444;
}

button:focus-visible,
#playlist li:focus-visible {
    outline: 3px solid #4388ff;
    outline-offset: 2px;
}

#start {
    background: #176b36;
}

#start:hover {
    background: #218548;
}

/* 재생 목록 */
#playlist {
    width: 100%;
    margin: 0;
    padding: 0;
    list-style: none;
}

#playlist li {
    min-width: 0;
    padding: 14px;
    margin: 8px 0;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    overflow-wrap: anywhere;
    transition: background-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
}

#playlist li.active {
    background: #d9f5e2;
    font-weight: bold;
    box-shadow: inset 3px 0 #176b36;
}

#playlist li:hover {
    background: #e8e8e8;
}

#playlist li.active:hover {
    background: #c8ed d4;
}

/* 태블릿 및 작은 화면 */
@media (max-width: 600px) {
    body {
        padding: 22px 16px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 19px;
        margin-top: 24px;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
    }

    .controls button {
        width: 100%;
        min-width: 0;
        padding: 10px 4px;
        font-size: 14px;
    }

    #playlist li {
        padding: 13px;
    }
}

/* 스마트폰 */
@media (max-width: 380px) {
    body {
        padding: 16px 12px;
    }

    h1 {
        font-size: 21px;
    }

    .controls {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .controls button {
        min-height: 46px;
        font-size: 15px;
    }

    #audio-artwork-wrapper {
        border-radius: 5px;
    }
}

/* 모션 최소화 설정 존중 */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}
</style>

</head>

<body>

<h1>    </h1>

<p id="status" role="status" aria-live="polite">
    플레이어를 준비하는 중입니다.
</p>

<!-- 곡별 이미지 -->

<div id="audio-artwork-wrapper" hidden>
    <img
        id="audio-artwork"
        alt="현재 재생 중인 오디오 이미지"
    >
</div>

<!-- 오디오 플레이어 -->

<audio id="audio" controls preload="none" hidden></audio>

<!-- 재생 컨트롤 -->

<div class="controls">
    <button id="start" type="button">재생 시작</button>
    <button id="prev" type="button">이전 곡</button>
    <button id="next" type="button">다음 곡</button>
</div>

<ul id="playlist"></ul>

<script>
const tracks = [
    {
        title: "외부 오디오 1",
        image: "https://images.squarespace-cdn.com/content/v1/5b31edf645776eefa829eeaf/1782404843834-HET6J47VYB1VCS1SSI1H/Regallily_Dawn_Seoul_poster_Aseries_260604.jpg",
        url: "https://github.com/xabiere1/radio/raw/refs/heads/main/ep01/takecaremycat_0.mp3"
    },
    {
        title: "외부 오디오 2",
        image: "https://wimg.sedaily.com/news/legacy/2023/02/17/29LSCV01T7_1.jpg",
        url: "https://github.com/xabiere1/radio/raw/refs/heads/main/ep01/takecaremycat_6.mp3"
    }
];

const status = document.getElementById("status");
const audio = document.getElementById("audio");
const audioArtworkWrapper =
    document.getElementById("audio-artwork-wrapper");
const audioArtwork = document.getElementById("audio-artwork");
const playlist = document.getElementById("playlist");
const startButton = document.getElementById("start");

let currentIndex = 0;
let started = false;
let isPlaying = false;
let switching = false;

function updatePlayButton(playing) {
    isPlaying = playing;
    startButton.textContent = playing ? "일시 정지" : "재생 시작";
}

function renderList() {
    playlist.innerHTML = "";

    tracks.forEach((track, index) => {
        const li = document.createElement("li");

        li.textContent = (index + 1) + ". " + track.title;
        li.tabIndex = 0;
        li.setAttribute("role", "button");
        li.setAttribute(
            "aria-current",
            index === currentIndex ? "true" : "false"
        );

        if (index === currentIndex) {
            li.classList.add("active");
        }

        li.addEventListener("click", () => playTrack(index));

        li.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                playTrack(index);
            }
        });

        playlist.appendChild(li);
    });
}

function stopAudio() {
    audio.pause();
    audio.onended = null;
    audio.onerror = null;
    updatePlayButton(false);
}

function playTrack(index) {
    if (index < 0 || index >= tracks.length) return;

    switching = false;
    stopAudio();

    currentIndex = index;

    const track = tracks[index];

    renderList();

    audioArtworkWrapper.hidden = false;
    audioArtwork.src = track.image;
    audioArtwork.alt = track.title + " 이미지";

    audio.hidden = false;
    audio.src = track.url;
    audio.load();

    audio.onended = nextTrack;

    audio.onplay = () => {
        updatePlayButton(true);
        status.textContent = "";
    };

    audio.onpause = () => {
        updatePlayButton(false);
    };

    audio.onerror = () => {
        const code = audio.error
            ? audio.error.code
            : "알 수 없음";

        status.textContent =
            "오디오 재생 오류 (코드 " + code +
            "). 파일 URL, 형식 또는 접근 권한을 확인하세요.";

        console.error(status.textContent);
    };

    started = true;

    audio.play().catch(error => {
        updatePlayButton(false);

        status.textContent =
            "오디오를 재생할 수 없습니다. 재생 버튼을 다시 누르거나 파일 URL과 접근 권한을 확인하세요.";

        console.warn("오디오 재생 실패:", error);
    });
}

function nextTrack() {
    if (switching) return;

    switching = true;

    if (currentIndex + 1 < tracks.length) {
        playTrack(currentIndex + 1);
    } else {
        stopAudio();

        audio.hidden = true;
        audioArtworkWrapper.hidden = true;

        status.textContent = "재생 목록이 끝났습니다.";

        switching = false;
    }
}

function prevTrack() {
    if (currentIndex > 0) {
        playTrack(currentIndex - 1);
    }
}

document.getElementById("next").addEventListener("click", nextTrack);
document.getElementById("prev").addEventListener("click", prevTrack);

startButton.addEventListener("click", () => {
    if (isPlaying) {
        audio.pause();
        return;
    }

    if (!started) {
        playTrack(0);
        return;
    }

    audio.play().catch(error => {
        updatePlayButton(false);

        status.textContent =
            "오디오를 재생할 수 없습니다. 파일 URL과 접근 권한을 확인하세요.";

        console.warn("오디오 재생 실패:", error);
    });
});

playTrack(0);
</script>

</body>
</html>
